name: Scrape Talk Locations

# Manual only. The map this produces is served at /talkmap.html, which nothing
# links to while `talkmap_link` is false in _config.yml, so running it on every
# push to _talks/** only spent CI time and pushed bot commits to master.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # This workflow pushes to the repository

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        # 3.10+ required: the notebook pip-installs python-frontmatter
        # unpinned, and since 1.2.0 it imports typing.TypeGuard, which does
        # not exist on 3.9.
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install jupyter pandas requests beautifulsoup4 geopy  # Add other dependencies as needed
        pip install getorg --upgrade

    - name: Run Jupyter Notebook
      run: |
        jupyter nbconvert --to notebook --execute talkmap.ipynb --output talkmap_out.ipynb

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Automated update of talk locations" || echo "No changes to commit"
        git push
